<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — HR Command Center</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root { --bg:#f1f5f9; --card:#f8fafc; --text:#1e293b; --muted:#475569; --border:#cbd5e1; --accent:#4338ca; --accent-text:#f8fafc; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#172033; --text:#e2e8f0; --muted:#a8b5c9; --border:#334155; --accent:#a5b4fc; --accent-text:#0f172a; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); font-family: system-ui, -apple-system, "SF Pro Text", Inter, "Segoe UI", sans-serif; font-size:1rem; line-height:1.55; background:var(--bg); color:var(--text); }
    main { max-width: 440px; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 24px; box-shadow: 0 4px 12px rgb(15 23 42 / 10%); }
    .icon { font-size:3rem; }
    h1 { font-size:1.375rem; margin:8px 0; }
    p { color:var(--muted); margin:0 0 16px; }
    button { font:inherit; font-weight:700; min-height:44px; min-width:44px; padding:8px 24px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-text); cursor:pointer; transition: transform 200ms cubic-bezier(0.2,0.8,0.2,1); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>This page isn't saved on your device yet. Your checklist progress is stored locally and will be there when you reconnect. Pages you have already opened still work offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
